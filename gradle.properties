# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (parameter names + javadoc layered on Mojmap).
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
# Pinned to the exact Minecraft release this branch targets.
minecraft_version_range=[1.21.1]
# The NeoForge version must agree with the Minecraft version to get a valid artifact.
neo_version=21.1.233
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties

# Unique mod identifier. Lowercase, matches the MOD_ID constant in the main mod class. Regex: [a-z][a-z0-9_]{1,63}
mod_id=cauchemar
# Human-readable display name.
mod_name=Cauchemar
# License of the mod. See https://choosealicense.com/
mod_license=All Rights Reserved
# Mod version. See https://semver.org/
mod_version=0.1.0
# Group ID, matches the base package of the mod sources.
mod_group_id=com.payangar.cauchemar

## Dependency Versions

# GeckoLib: animation and rendering engine (Blockbench models, keyframe animations).
# Latest versions: https://www.curseforge.com/minecraft/mc-mods/geckolib/files
geckolib_version=4.8.4
