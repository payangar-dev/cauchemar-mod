# NeoForge mod metadata. Standard TOML. Placeholder tokens are expanded from gradle.properties at build time.
# https://docs.neoforged.net/docs/gettingstarted/modfiles/

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/payangar-dev/cauchemar-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Payangar"
displayURL="https://github.com/payangar-dev/cauchemar-mod"
#logoFile="cauchemar.png"
description='''
A NeoForge mod for Minecraft 1.21.1.
'''

# Uncomment when you add a mixin config at src/main/resources/cauchemar.mixins.json
#[[mixins]]
#config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"
